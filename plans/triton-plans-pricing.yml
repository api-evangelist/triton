specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Triton Inference Server
providerId: triton
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - AI
  - Inference
  - Open Source
  - Model Serving
description: NVIDIA Triton Inference Server is open-source software (BSD-3-Clause) that customers
  self-host on their own CPUs / GPUs. There is no per-API call price from NVIDIA for the server
  itself; commercial entitlements (support, indemnification, cloud images) ship via the separate
  NVIDIA AI Enterprise subscription.
sources:
  - https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html
  - https://github.com/triton-inference-server/server
notes: Triton itself is open-source and free to use; cost is the user's compute and any optional
  NVIDIA AI Enterprise support contract. No per-call rate card is published by NVIDIA for the server.
plans:
  - id: triton-open-source
    name: Open Source
    type: freemium
    description: Self-hosted, freely redistributable Triton Inference Server. Cost to the user is
      compute (CPU / GPU) and operational overhead, not a license fee.
    entries:
      - label: Software License
        name: software_license
        type: flat
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: BSD-3-Clause License
      - name: Self-Hosted
      - name: Community Support (GitHub Discussions)
      - name: KServe V2 Inference Protocol
  - id: triton-nvidia-ai-enterprise
    name: NVIDIA AI Enterprise (Optional Support)
    type: enterprise
    description: Optional commercial support, security patching, and indemnification for Triton
      delivered through the NVIDIA AI Enterprise subscription. Pricing is tied to the AI Enterprise
      product, not Triton calls.
    entries:
      - label: Support Subscription
        name: support_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see NVIDIA AI Enterprise pricing
        userMultiplied: false
    elements:
      - name: Enterprise Support
      - name: Security Patching
      - name: Indemnification
