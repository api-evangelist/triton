name: Triton Inference Server
description: >-
  NVIDIA Triton Inference Server provides a cloud and edge inferencing solution optimized for both CPUs and GPUs. Triton
  supports an HTTP/REST and gRPC protocol that allows remote clients to request inferencing for any model being managed
  by the server. Open source and part of the broader NVIDIA AI ecosystem, Triton implements the KServe V2 inference
  protocol supporting TensorRT, TensorFlow, PyTorch, ONNX Runtime, Python, and more backends.
