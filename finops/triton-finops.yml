principles:
  - name: Visibility
    description: Use Triton's Prometheus metrics endpoint (port 8002) to track inference request
      counts, latencies, GPU utilization, and queue time per model; pair with the underlying
      cloud / on-prem cost telemetry for total cost-of-inference.
  - name: Allocation
    description: Allocate inference cost by model, backend (TensorRT, ONNX, PyTorch, Python),
      protocol (HTTP / gRPC), and consuming team using the model name and Triton tags as the
      primary dimensions.
  - name: Optimization
    description: Optimization levers are operator-controlled — enable dynamic batching, tune
      instance group counts, mix CPU and GPU instance groups, use TensorRT or ONNX-Runtime
      backends for lower latency / higher throughput per dollar, and use the Model Analyzer to
      pick batch sizes.
  - name: Accountability
    description: Platform / MLOps team owns the Triton deployment and underlying cluster cost; per-model
      owners are accountable for their model's GPU-hour consumption and queue behavior.
